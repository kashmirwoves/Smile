<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMILE</title>
  <style>
    :root{
      --bg:#0a0c11;
      --card:#151927;
      --card-soft:#1d2233;
      --pink:#ff4da6;
      --pink-soft:#ff9ad5;
      --text:#f2f4f9;
      --muted:#9aa0ad;
    }*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(800px 400px at 70% 120%, rgba(255,77,166,0.14), transparent 45%),
    var(--bg);
  color:var(--text);
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

/* Title */
header{
  text-align:center;
  padding:32px 16px 10px;
}
header h1{
  margin:0;
  font-size:30px;
  letter-spacing:7px;
  font-weight:900;
  color:#fff;
  text-shadow:0 3px 14px rgba(0,0,0,.9);
}
header p{
  margin-top:10px;
  font-size:13px;
  color:var(--muted);
}

/* Main stack centered and vertical */
.stack{
  position:absolute;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:24px;
}

/* Counter card */
.counter{
  width:180px;
  padding:20px;
  background:linear-gradient(180deg,var(--card-soft),var(--card));
  border-radius:18px;
  box-shadow:0 20px 50px rgba(0,0,0,.65);
  position:relative;
  text-align:center;
}
.counter .label{
  position:absolute;
  top:-12px;
  left:14px;
  background:#23283a;
  padding:4px 10px;
  border-radius:10px;
  font-size:11px;
  color:var(--pink-soft);
}
.counter .value{
  font-size:48px;
  font-weight:800;
}
.counter .sub{
  font-size:12px;
  color:var(--muted);
}

/* Circular smile button */
.smile-btn{
  width:140px;
  height:140px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  background:
    radial-gradient(120% 120% at 30% 30%, #3a3f55, #1f2233);
  color:#fff;
  font-size:16px;
  font-weight:800;
  letter-spacing:1px;
  text-align:center;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.08),
    0 20px 50px rgba(0,0,0,.7),
    0 0 35px rgba(255,77,166,.5);
  text-shadow:0 2px 8px rgba(0,0,0,.9);
  transition:transform .08s ease;
}
.smile-btn:active{
  transform:scale(.95);
}

/* Small pink memory text top-right */
.memory-note{
  position:fixed;
  top:14px;
  right:14px;
  font-size:10px;
  color:var(--pink-soft);
  opacity:.85;
  letter-spacing:.3px;
  text-shadow:0 0 6px rgba(255,77,166,.4);
}

footer{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  font-size:11px;
  color:var(--muted);
}

  </style>
</head>
<body>  <header>
    <h1>S M I L E</h1>
    <p>a quiet place to count your smiles</p>
  </header>  <div class="stack">
    <div class="counter">
      <div class="label">It's okay, no worries</div>
      <div id="count" class="value">0</div>
      <div class="sub">total smiles</div>
    </div><button id="smileBtn" class="smile-btn">I<br>SMILED</button>

  </div>  <div class="memory-note">i didn't forget your name</div>  <footer>
    saved privately on your device
  </footer>  <script>
    const KEY='i_smiled_counter_final';
    const countEl=document.getElementById('count');
    const btn=document.getElementById('smileBtn');

    let count=parseInt(localStorage.getItem(KEY),10);
    if(isNaN(count)) count=0;
    countEl.textContent=count;

    btn.addEventListener('click',()=>{
      count++;
      countEl.textContent=count;
      localStorage.setItem(KEY,String(count));
    });
  </script></body>
</html>
