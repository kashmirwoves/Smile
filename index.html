<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SMILE</title>

<style>
:root{
  --bg:#0a0c11;
  --card:#151927;
  --card-soft:#1d2233;
  --pink:#ff4da6;
  --pink-soft:#ff9ad5;
  --text:#f2f4f9;
  --muted:#9aa0ad;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(800px 400px at 70% 120%, rgba(255,77,166,0.14), transparent 45%),
    var(--bg);
  color:var(--text);
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

/* Header */
header{
  text-align:center;
  padding:28px 16px 18px;
}
header h1{
  margin:0;
  font-size:30px;
  letter-spacing:7px;
  font-weight:900;
  color:#fff;
  text-shadow:0 3px 14px rgba(0,0,0,.9);
}
header p{
  margin-top:10px;
  font-size:13px;
  color:var(--muted);
}

/* Stack */
.stack{
  margin-top:18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
}

/* Counter */
.counter{
  width:190px;
  padding:20px 16px 18px;
  background:linear-gradient(180deg,var(--card-soft),var(--card));
  border-radius:18px;
  box-shadow:0 18px 40px rgba(0,0,0,.65);
  position:relative;
  text-align:center;
}
.counter.pop-add{animation:popAdd .25s ease}
.counter.pop-sub{animation:popSub .25s ease}

@keyframes popAdd{
  0%{transform:scale(1)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}
@keyframes popSub{
  0%{transform:scale(1)}
  50%{transform:scale(.9)}
  100%{transform:scale(1)}
}

.counter .label{
  position:absolute;
  top:-12px;
  left:14px;
  background:#23283a;
  padding:4px 10px;
  border-radius:10px;
  font-size:11px;
  color:var(--pink-soft);
}
.counter .value{
  font-size:44px;
  font-weight:800;
}
.counter .sub{
  font-size:12px;
  color:var(--muted);
}

/* Buttons */
.buttons{
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* Smile button */
.smile-btn{
  width:120px;
  height:120px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  background:
    radial-gradient(120% 120% at 30% 30%, #3a3f55, #1f2233);
  color:#fff;
  font-size:14px;
  font-weight:800;
  letter-spacing:1px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.08),
    0 18px 40px rgba(0,0,0,.7),
    0 0 30px rgba(255,77,166,.45);
  text-shadow:0 2px 8px rgba(0,0,0,.9);
}
.smile-btn:active{transform:scale(.95)}

/* Undo button */
.undo-btn{
  width:120px;
  height:120px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  background:
    radial-gradient(140% 140% at 30% 30%, #2b2b2b, #000);
  color:#fff;
  font-size:13px;
  font-weight:700;
  letter-spacing:1px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.05),
    inset 0 -10px 20px rgba(255,255,255,.04),
    0 16px 35px rgba(0,0,0,.8);
}
.undo-btn:active{transform:scale(.93)}

/* Popup message */
.popup{
  position:absolute;
  top:-50px;
  left:50%;
  transform:translateX(-50%) scale(.9);
  background:rgba(255,77,166,.15);
  border:1px solid rgba(255,77,166,.5);
  color:var(--pink-soft);
  padding:6px 12px;
  border-radius:12px;
  font-size:12px;
  font-weight:600;
  box-shadow:0 0 20px rgba(255,77,166,.35);
  opacity:0;
  pointer-events:none;
  animation:popupShow 4s ease forwards;
}

@keyframes popupShow{
  0%{opacity:0; transform:translateX(-50%) translateY(10px) scale(.9)}
  10%{opacity:1; transform:translateX(-50%) translateY(0) scale(1)}
  85%{opacity:1}
  100%{opacity:0; transform:translateX(-50%) translateY(-6px) scale(.95)}
}

/* Memory text */
.memory-note{
  position:fixed;
  top:10px;
  right:14px;
  font-size:10px;
  color:var(--pink-soft);
  opacity:.85;
  letter-spacing:.3px;
  text-shadow:0 0 6px rgba(255,77,166,.4);
}

footer{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  font-size:11px;
  color:var(--muted);
}
</style>
</head>

<body>

<header>
  <h1>S M I L E</h1>
  <p>a quiet place to count your smiles</p>
</header>

<div class="stack">
  <div id="counter" class="counter">
    <div class="label">you made it through</div>
    <div id="count" class="value">0</div>
    <div class="sub">hard-time smiles</div>
  </div>

  <div class="buttons">
    <button id="smileBtn" class="smile-btn">I<br>SMILED</button>
    <button id="undoBtn" class="undo-btn">UNDO<br>SMILE</button>
  </div>
</div>

<div class="memory-note">i didn't forget your name</div>
<footer>saved privately on your device</footer>

<script>
const KEY='i_smiled_counter_final';
const countEl=document.getElementById('count');
const counterEl=document.getElementById('counter');
const addBtn=document.getElementById('smileBtn');
const undoBtn=document.getElementById('undoBtn');

let count=parseInt(localStorage.getItem(KEY),10);
if(isNaN(count)) count=0;
countEl.textContent=count;

function save(){
  localStorage.setItem(KEY,String(count));
}

function showPopup(){
  const popup=document.createElement('div');
  popup.className='popup';
  popup.textContent='you did it';
  addBtn.style.position='relative';
  addBtn.appendChild(popup);
  setTimeout(()=>popup.remove(),4000);
}

addBtn.addEventListener('click',()=>{
  count++;
  countEl.textContent=count;
  save();
  counterEl.classList.remove('pop-sub');
  counterEl.classList.add('pop-add');
  showPopup();
  setTimeout(()=>counterEl.classList.remove('pop-add'),250);
});

undoBtn.addEventListener('click',()=>{
  if(count>0){
    count--;
    countEl.textContent=count;
    save();
    counterEl.classList.remove('pop-add');
    counterEl.classList.add('pop-sub');
    setTimeout(()=>counterEl.classList.remove('pop-sub'),250);
  }
});
</script>

</body>
</html>
