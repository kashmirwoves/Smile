<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Smiled</title>
  <style>
    :root {
      --bg: #0d0f14;
      --card: #161a23;
      --accent: #ff4da6;
      --accent-soft: #ff8fcf;
      --text: #e8eaf0;
      --muted: #9aa0ad;
    }* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(900px 400px at 80% 110%, rgba(255,77,166,0.15), transparent 45%), var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

header {
  text-align: center;
  padding: 20px 16px 10px;
}

header h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 700;
}

header p {
  margin: 6px 0 0;
  font-size: 13px;
  color: var(--muted);
}

.brooch {
  position: fixed;
  right: 20px;
  bottom: 130px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #ffd1ea, var(--accent));
  box-shadow: 0 0 18px rgba(255,77,166,0.8), 0 0 40px rgba(255,77,166,0.4);
}

.container {
  position: fixed;
  left: 50%;
  bottom: 70px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 16px;
}

.counter {
  background: linear-gradient(180deg, #1f2433, var(--card));
  border-radius: 14px;
  padding: 18px 20px;
  min-width: 150px;
  position: relative;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.counter-label {
  position: absolute;
  top: -12px;
  left: 14px;
  background: #23283a;
  padding: 4px 10px;
  border-radius: 10px;
  font-size: 12px;
  color: var(--accent-soft);
}

.counter-value {
  text-align: center;
  font-size: 40px;
  font-weight: 700;
  margin-top: 8px;
}

.counter-sub {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
}

.smile-btn {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  border: none;
  background: radial-gradient(120% 120% at 20% 20%, #3a3f55, #262a3b);
  color: white;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 12px 28px rgba(0,0,0,0.6), 0 0 22px rgba(255,77,166,0.25);
}

.smile-btn:active {
  transform: scale(0.95);
}

footer {
  position: fixed;
  bottom: 14px;
  width: 100%;
  text-align: center;
  font-size: 11px;
  color: var(--muted);
}

  </style>
</head>
<body>  <header>
    <h1>I Smiled</h1>
    <p>A quiet place to count your smiles</p>
  </header>  <div class="brooch"></div>  <div class="container">
    <div class="counter">
      <div class="counter-label">It's okay, no worries</div>
      <div id="count" class="counter-value">0</div>
      <div class="counter-sub">total smiles</div>
    </div><button class="smile-btn" id="smileBtn">I smiled</button>

  </div>  <footer>
    saved privately on your device
  </footer>  <script>
    const STORAGE_KEY = 'i_smiled_counter';
    const countEl = document.getElementById('count');
    const btn = document.getElementById('smileBtn');

    let count = parseInt(localStorage.getItem(STORAGE_KEY)) || 0;
    countEl.textContent = count;

    btn.addEventListener('click', function () {
      count++;
      countEl.textContent = count;
      localStorage.setItem(STORAGE_KEY, count);
    });
  </script></body>
</html>
