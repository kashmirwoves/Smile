<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I Smiled</title>
  <style>
    :root{
      --bg:#0b0b0f;
      --card:#141421;
      --pink:#ff4da6;
      --pink-soft:#ff7cc6;
      --btn:#2a2a3d;
      --btn-light:#3a3a5a;
      --text:#f2f2f7;
      --muted:#b9b9c7;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background: radial-gradient(1200px 600px at 80% 120%, rgba(255,77,166,.15), transparent 40%), var(--bg);
      color:var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }/* Pink brooch / accent */
.brooch{
  position:fixed;
  right:18px;
  bottom:120px; /* below the corner */
  width:18px;
  height:18px;
  border-radius:50%;
  background: radial-gradient(circle at 30% 30%, #ffd1ea, var(--pink));
  box-shadow: 0 0 18px rgba(255,77,166,.8), 0 0 40px rgba(255,77,166,.4);
  z-index:2;
}

/* Main container positioned slightly toward center */
.wrap{
  position:fixed;
  right:50%;
  transform: translateX(50%);
  bottom:64px;
  display:flex;
  align-items:center;
  gap:16px;
}

/* Counter card */
.counter{
  background: linear-gradient(180deg, #1a1a2e, var(--card));
  border-radius:14px;
  padding:14px 16px 16px;
  min-width:140px;
  box-shadow: 0 10px 30px rgba(0,0,0,.45);
  position:relative;
}
.counter .label{
  position:absolute;
  top:-12px;
  left:12px;
  background:#1f1f35;
  padding:4px 10px;
  border-radius:10px;
  font-size:12px;
  color:var(--pink-soft);
  box-shadow:0 6px 14px rgba(0,0,0,.35);
}
.counter .value{
  font-size:36px;
  font-weight:700;
  text-align:center;
  margin-top:6px;
}
.counter .sub{
  text-align:center;
  font-size:12px;
  color:var(--muted);
}

/* Circular button */
.smile-btn{
  width:86px;
  height:86px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  color:#fff;
  font-weight:700;
  background:
    radial-gradient(120% 120% at 20% 20%, var(--btn-light), var(--btn)),
    linear-gradient(135deg, rgba(255,255,255,.15), rgba(255,255,255,0));
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.08),
    0 10px 30px rgba(0,0,0,.5),
    0 0 24px rgba(255,124,198,.25);
  transition: transform .08s ease, box-shadow .08s ease;
}
.smile-btn:active{
  transform: scale(.96);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.12),
    0 6px 18px rgba(0,0,0,.6);
}

/* Small helper for very small screens */
@media (max-width:360px){
  .wrap{gap:12px}
  .smile-btn{width:76px;height:76px;font-size:12px}
  .counter .value{font-size:32px}
}

  </style>
</head>
<body>
  <div class="brooch" aria-hidden="true"></div>  <div class="wrap">
    <div class="counter" aria-live="polite">
      <div class="label">It's okay, no worries</div>
      <div id="count" class="value">0</div>
      <div class="sub">total smiles</div>
    </div><button id="smileBtn" class="smile-btn" aria-label="I smiled">
  I smiled
</button>

  </div>  <script>
    const KEY = 'i_smiled_count_v1';
    const countEl = document.getElementById('count');
    const btn = document.getElementById('smileBtn');

    // Load saved data
    let count = Number(localStorage.getItem(KEY) || 0);
    countEl.textContent = count;

    // Save + update on click
    btn.addEventListener('click', () => {
      count += 1;
      countEl.textContent = count;
      localStorage.setItem(KEY, String(count));
    });
  </script></body>
</html>
